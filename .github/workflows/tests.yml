name: Tests
run-name: ${{ github.actor }} ran API and UI tests on ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TEST_ENV: local
  BUN_VERSION: '1.3.14'
  SUPABASE_CLI_VERSION: '2.109.1'

jobs:
  tests:
    name: API + UI (local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout fresco-qa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the Fresco app under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BasiMontes/fresco
          path: fresco-app

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'fresco-app/bun.lock') }}
          restore-keys: bun-deps-${{ runner.os }}-

      - name: Install fresco-qa dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: fresco-app
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Chromium
        run: bun run pw:install

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Build the app .env from the committed CI overlay
        working-directory: fresco-app
        run: |
          cat .env.ci > .env
          cat >> .env <<'DUMMIES'
          STRIPE_PRICE_ID_PRO_MONTH=price_ci_dummy_month
          STRIPE_WEBHOOK_SECRET_PRE=whsec_ci_dummy_pre
          STRIPE_SECRET_KEY=sk_test_ci_dummy
          RESEND_API_KEY=re_ci_dummy_not_a_real_key
          CRON_SECRET=ci-dummy-cron-secret
          DUMMIES
          printf 'NEXT_PUBLIC_TURNSTILE_SITE_KEY=\n' >> .env

      - name: Build the app in the background
        working-directory: fresco-app
        run: |
          set -a; . ./.env; set +a
          rm -f "$RUNNER_TEMP/build.exit"
          nohup bash -c "bun run build > '$RUNNER_TEMP/build.log' 2>&1; echo \$? > '$RUNNER_TEMP/build.exit'" >/dev/null 2>&1 &

      - name: Start local Supabase
        working-directory: fresco-app
        timeout-minutes: 10
        run: supabase start -x realtime,storage-api,imgproxy,studio,inbucket,logflare,vector

      - name: Apply migrations and seed the recipe catalog
        working-directory: fresco-app
        run: supabase db reset

      - name: Export the local stack coordinates
        working-directory: fresco-app
        run: |
          supabase status -o env > "$RUNNER_TEMP/stack.env"
          for name in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            value=$(awk -F= -v k="$name" '$1==k { gsub(/^"|"$/, "", $2); print $2 }' "$RUNNER_TEMP/stack.env")
            [ -n "$value" ] || { echo "::error::supabase status did not report $name"; exit 1; }
            echo "::add-mask::$value"
            echo "SUPABASE_${name}=$value" >> "$GITHUB_ENV"
          done
          rm -f "$RUNNER_TEMP/stack.env"

      - name: Wait for the edge functions gateway
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_API_URL/functions/v1/generate-meal-plan" || true)
            case "$code" in 200|400|401|403|405|422) echo "edge functions answer ($code)"; exit 0;; esac
            sleep 2
          done
          echo "::error::generate-meal-plan did not answer within 120 s (last status $code)"
          exit 1

      - name: Wait for the build and start the app
        working-directory: fresco-app
        run: |
          set -a; . ./.env; set +a
          for _ in $(seq 1 180); do
            [ -f "$RUNNER_TEMP/build.exit" ] && break
            sleep 2
          done
          exit_code=$(cat "$RUNNER_TEMP/build.exit" 2>/dev/null || echo timeout)
          if [ "$exit_code" != "0" ]; then
            echo "::error::bun run build did not finish cleanly ($exit_code)"
            tail -n 100 "$RUNNER_TEMP/build.log" || true
            exit 1
          fi
          nohup bun run start > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "::error::the app did not answer on http://localhost:3000 within 120 s"
          tail -n 100 "$RUNNER_TEMP/app.log" || true
          exit 1

      - name: Seed the three personas
        env:
          PRODUCT_DIR: ${{ github.workspace }}/fresco-app
        run: bun scripts/ci/seed-personas.ts

      - name: Run API and UI suites
        run: bun run test --project=integration --project=e2e

      - name: Job summary
        if: always()
        run: |
          {
            echo '### Test results'
            if [ -f test-results/results.json ]; then
              jq -r '"| passed | failed | flaky | skipped |\n|---|---|---|---|\n| \(.stats.expected) | \(.stats.unexpected) | \(.stats.flaky) | \(.stats.skipped) |"' test-results/results.json
            else
              echo 'No results file: the run stopped before Playwright reported.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report, Allure results and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test outcomes for the public results page
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-outcomes
          path: reports/test-outcomes.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack diagnostics on failure
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          for name in $(docker ps -a --format '{{.Names}}' | grep -E '^supabase_edge_runtime_' || true); do
            echo "::group::${name}"
            docker logs --tail 200 "$name" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::app log"
          tail -n 200 "$RUNNER_TEMP/app.log" || true
          echo "::endgroup::"

      - name: Stop Supabase
        if: always()
        working-directory: fresco-app
        run: supabase stop --no-backup

  publish-report:
    name: Publish results page
    needs: tests
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.tests.result != 'cancelled' && needs.tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout fresco-qa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download test outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-outcomes
          path: reports

      - name: Render the results page
        run: bun scripts/ci/render-report.ts reports/test-outcomes.json public-report/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
